name: Deploy Svelte Site to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  PUB_KEY: ${{ secrets.PUB_KEY }}
  HCAPTCHA_KEY: ${{ secrets.HCAPTCHA_KEY }}
  PUBLIC_SITE_KEY: 001ad710-986e-4664-91e8-b324618a2146
  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      contents: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Build the Site
        env:
          HCAPTCHA_KEY: ${{ secrets.HCAPTCHA_KEY }}
          PUBLIC_SITE_KEY: 001ad710-986e-4664-91e8-b324618a2146
        run: pnpm run build -- --mode production

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
