name: Deploy Svelte to GitHub Pages

on:
  push:
    branches:
      - dev  # Change this if your default branch isn't 'main'

env:
  PUB_KEY: ${{ secrets.PUB_KEY }}
  HCAPTCHA_KEY: ${{ secrets.HCAPTCHA_KEY }}
  PUBLIC_SITE_KEY: 001ad710-986e-4664-91e8-b324618a2146
  PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Svelte Kit Latest Installation
        run: npm install @sveltejs/kit@latest

      - name: Install Pages Adapter
        run: npm install @sveltejs/adapter-static@latest
     
      - name: Install Cheerio
        run: npm install cheerio

      - name: Flowbite fixing
        run: npm install flowbite-svelte-icons@latest

      - name: Update Dependencies
        run: npm update

      - name: Build
        env:
          HCAPTCHA_KEY: ${{ secrets.HCAPTCHA_KEY }}
          PUBLIC_SITE_KEY: 001ad710-986e-4664-91e8-b324618a2146
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
